<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de QR - Patitas Seguras Salta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f3f4f6; color: #111827; padding: 16px; }
    .container { max-width: 760px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.sub { margin: 0 0 16px; color: #6b7280; font-size: 14px; }
    .field { margin-bottom: 14px; max-width: 260px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #374151; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; }
    button { border: none; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .btn-primary { background: #f97316; color: #fff; width: 100%; }
    .btn-google { background: #111827; color: #fff; width: 100%; }
    .btn-small { padding: 7px 10px; font-size: 12px; background: #e5e7eb; color: #111827; }
    .btn-dl { background: #16a34a; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .status { font-size: 13px; color: #374151; margin-top: 10px; min-height: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .tag-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; text-align: center; background: #fafafa; }
    .qr-index { display: inline-block; background: #111827; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-bottom: 6px; }
    .tag-num { font-weight: 800; font-size: 15px; margin-bottom: 8px; }
    .qr-box { display: flex; justify-content: center; margin: 8px auto; min-height: 128px; }
    .tag-url { font-size: 11px; color: #6b7280; word-break: break-all; margin: 6px 0 10px; }
    .actions { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="container">

  <!-- LOGIN -->
  <div id="auth-box" class="card" style="text-align:center;">
    <h1>Generador de QR — Chapitas</h1>
    <p class="sub">Iniciá sesión con tu cuenta de Google para crear y probar chapitas con ID aleatorio.</p>
    <button id="btn-google-login" class="btn-google">Ingresar con Google</button>
    <div id="auth-status" class="status"></div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div id="panel-box" class="hidden">
    <div class="card">
      <div class="top-bar">
        <div>
          <h1>Generador de IDs Aleatorios</h1>
          <p class="sub" style="margin:0;">Numeración interna visible (QR #1, #2...) con ID aleatorio en el enlace.</p>
        </div>
        <button id="btn-logout" class="btn-small">Cerrar sesión</button>
      </div>

      <div class="field">
        <label for="inp-qty">Cantidad de QR a generar</label>
        <input id="inp-qty" type="number" min="1" max="200" step="1" value="3" />
      </div>

      <button id="btn-generate" class="btn-primary">Generar QR con ID aleatorio (disponible)</button>
      <div id="gen-status" class="status"></div>
    </div>

    <div class="card">
      <div class="top-bar">
        <h2 style="margin:0; font-size:18px;">QR generados (<span id="tags-count">0</span>)</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="btn-delete-all" class="btn-small btn-danger">Borrar todos</button>
          <button id="btn-refresh" class="btn-small">Actualizar lista</button>
        </div>
      </div>
      <div id="tags-grid" class="grid"></div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, deleteDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBfs9FUMFCMYGprhVSRj2vYx_kko0sbrHY",
    authDomain: "patitas-seguras-salta.firebaseapp.com",
    projectId: "patitas-seguras-salta",
    storageBucket: "patitas-seguras-salta.firebasestorage.app",
    messagingSenderId: "311814224464",
    appId: "1:311814224464:web:6cd643e607fbb90c3b6f55"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const ID_LENGTH = 6;
  const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  const authBox = document.getElementById("auth-box");
  const panelBox = document.getElementById("panel-box");
  const authStatus = document.getElementById("auth-status");
  const genStatus = document.getElementById("gen-status");
  const tagsGrid = document.getElementById("tags-grid");
  const tagsCount = document.getElementById("tags-count");

  function buildTagUrl(code) {
    const base = window.location.href.replace(/generador\.html.*$/i, "index.html");
    const cleanBase = base.endsWith("/") ? base + "index.html" : base;
    return `${cleanBase}?id=${encodeURIComponent(code)}`;
  }

  function generateCandidateId(length = ID_LENGTH) {
    const bytes = new Uint8Array(length);
    crypto.getRandomValues(bytes);
    let out = "";
    for (let i = 0; i < length; i++) {
      out += ALPHABET[bytes[i] % ALPHABET.length];
    }
    return out;
  }

  async function generateUniqueId(usedInBatch) {
    for (let attempt = 0; attempt < 20; attempt++) {
      const candidate = generateCandidateId(ID_LENGTH);
      if (usedInBatch.has(candidate)) continue;
      const snap = await getDoc(doc(db, "chapitasInventario", candidate));
      if (!snap.exists()) {
        usedInBatch.add(candidate);
        return candidate;
      }
    }
    throw new Error("No se pudo generar un ID único tras varios intentos.");
  }

  function formatearEstadoVisible(estadoRaw) {
    const limpio = String(estadoRaw || "").trim().toLowerCase();
    if (!limpio || limpio === "virgen" || limpio === "disponible") {
      return "disponible";
    }
    return estadoRaw;
  }

  async function deleteTag(docId, code) {
    try {
      await deleteDoc(doc(db, "chapitasInventario", docId));
      genStatus.textContent = `Chapita ${code} borrada.`;
      await loadTags();
    } catch (e) {
      genStatus.textContent = `No se pudo borrar ${code}: revisá permisos en Firestore.`;
    }
  }

  function renderTagCard(qrNumber, docId, code, estado = "disponible") {
    const estadoVisible = formatearEstadoVisible(estado);
    const url = buildTagUrl(code);
    const card = document.createElement("div");
    card.className = "tag-card";

    const indexBadge = document.createElement("div");
    indexBadge.className = "qr-index";
    indexBadge.textContent = `QR #${qrNumber}`;

    const numEl = document.createElement("div");
    numEl.className = "tag-num";
    numEl.textContent = `ID ${code} (${estadoVisible})`;

    const qrDiv = document.createElement("div");
    qrDiv.className = "qr-box";
    new QRCode(qrDiv, {
      text: url,
      width: 124,
      height: 124,
      correctLevel: QRCode.CorrectLevel.M
    });

    const urlEl = document.createElement("div");
    urlEl.className = "tag-url";
    urlEl.textContent = url;

    const actions = document.createElement("div");
    actions.className = "actions";

    const btnCopy = document.createElement("button");
    btnCopy.className = "btn-small";
    btnCopy.textContent = "Copiar link NFC";
    btnCopy.onclick = async () => {
      await navigator.clipboard.writeText(url);
      btnCopy.textContent = "¡Copiado!";
      setTimeout(() => (btnCopy.textContent = "Copiar link NFC"), 1200);
    };

    const btnDl = document.createElement("button");
    btnDl.className = "btn-small btn-dl";
    btnDl.textContent = "Bajar QR";
    btnDl.onclick = () => {
      const canvas = qrDiv.querySelector("canvas");
      const img = qrDiv.querySelector("img");
      const href = canvas ? canvas.toDataURL("image/png") : img?.src;
      if (!href) return;
      const a = document.createElement("a");
      a.href = href;
      a.download = `qr-${qrNumber}-${code}.png`;
      a.click();
    };

    const btnDel = document.createElement("button");
    btnDel.className = "btn-small btn-danger";
    btnDel.textContent = "Borrar";
    btnDel.onclick = () => deleteTag(docId, code);

    actions.append(btnCopy, btnDl, btnDel);
    card.append(indexBadge, numEl, qrDiv, urlEl, actions);
    tagsGrid.appendChild(card);
  }

  async function loadTags() {
    tagsGrid.innerHTML = "";
    let total = 0;
    try {
      const snap = await getDocs(collection(db, "chapitasInventario"));
      const docs = [];
      snap.forEach((docSnap) => {
        const d = docSnap.data();
        docs.push({
          id: docSnap.id,
          code: d.code || docSnap.id,
          estado: d.status || d.estado || "disponible",
          createdAt: d.createdAt || ""
        });
      });
      docs.sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      for (let i = 0; i < docs.length; i++) {
        const item = docs[i];
        total += 1;
        renderTagCard(i + 1, item.id, item.code, item.estado);
      }
      tagsCount.textContent = String(total);
    } catch (e) {
      genStatus.textContent = "No se pudo cargar la lista desde Firebase (revisá las reglas de Firestore).";
    }
  }

  document.getElementById("btn-google-login").onclick = async () => {
    authStatus.textContent = "Abriendo Google...";
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      authStatus.textContent = "No se pudo iniciar sesión con Google.";
    }
  };

  document.getElementById("btn-logout").onclick = () => signOut(auth);
  document.getElementById("btn-refresh").onclick = loadTags;

  document.getElementById("btn-delete-all").onclick = async () => {
    genStatus.textContent = "Borrando chapitas...";
    try {
      const snap = await getDocs(collection(db, "chapitasInventario"));
      let borradas = 0;
      for (const docSnap of snap.docs) {
        await deleteDoc(doc(db, "chapitasInventario", docSnap.id));
        borradas += 1;
      }
      genStatus.textContent = `Listo: se borraron ${borradas} chapitas.`;
      await loadTags();
    } catch (e) {
      genStatus.textContent = "Error al borrar en Firestore: revisá que tu usuario tenga permiso de borrado.";
    }
  };

  document.getElementById("btn-generate").onclick = async () => {
    const qty = parseInt(document.getElementById("inp-qty").value, 10);
    if (isNaN(qty) || qty < 1 || qty > 200) {
      genStatus.textContent = "Ingresá una cantidad entre 1 y 200.";
      return;
    }

    genStatus.textContent = `Generando ${qty} QR con ID aleatorio...`;
    try {
      const usedInBatch = new Set();
      const createdIds = [];
      for (let i = 0; i < qty; i++) {
        const code = await generateUniqueId(usedInBatch);
        await setDoc(doc(db, "chapitasInventario", code), {
          code,
          status: "disponible",
          estado: "disponible",
          createdAt: new Date().toISOString(),
          createdBy: auth.currentUser?.uid || ""
        });
        createdIds.push(code);
      }
      genStatus.textContent = `Listo: se generaron ${createdIds.length} QR (${createdIds.join(", ")}).`;
      await loadTags();
    } catch (e) {
      genStatus.textContent = "Error al guardar en Firestore: revisá que tu usuario tenga permiso de escritura.";
    }
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      authBox.classList.add("hidden");
      panelBox.classList.remove("hidden");
      await loadTags();
    } else {
      panelBox.classList.add("hidden");
      authBox.classList.remove("hidden");
      authStatus.textContent = "";
    }
  });
</script>
</body>
</html>
