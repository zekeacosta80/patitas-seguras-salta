<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patitas Seguras Salta — Registrar Perrito</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #18181b;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 4px;
      color: #0f766e;
    }
    .codigo {
      font-size: 0.88rem;
      color: #52525b;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d4d4d8;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { min-height: 75px; resize: vertical; }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #0f766e;
      color: #fff;
      margin-top: 14px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f4f4f5;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .btn-salir {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: #e4e4e7;
      color: #18181b;
    }
    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐾 Patitas Seguras Salta</h1>
    <div id="txtCodigo" class="codigo">Verificando chapita...</div>

    <!-- 1. Solo Login con Google -->
    <div id="vistaLogin" class="hidden">
      <p>Esta chapita está lista para usar. Entrá con tu cuenta de Google para registrar a tu perrito.</p>
      <button id="btnGoogle" type="button">Continuar con Google</button>
    </div>

    <!-- 2. Panel de registro del perrito (solo visible si entró con Google) -->
    <div id="vistaRegistro" class="hidden">
      <div class="user-bar">
        <span id="txtUsuario">—</span>
        <button id="btnSalir" type="button" class="btn-salir">Salir</button>
      </div>

      <form id="formPerrito">
        <label for="nombreMascota">Nombre del perrito *</label>
        <input id="nombreMascota" type="text" required placeholder="Ej: Moro" />

        <label for="raza">Raza / Descripción</label>
        <input id="raza" type="text" placeholder="Ej: Mestizo negro, tamaño mediano" />

        <label for="telefono">WhatsApp / Teléfono de contacto *</label>
        <input id="telefono" type="tel" required placeholder="Ej: 3875123456" />

        <label for="nota">Aviso importante (opcional)</label>
        <textarea id="nota" placeholder="Ej: Toma medicación, es muy asustadizo..."></textarea>

        <button id="btnGuardar" type="submit">Guardar y activar chapita</button>
      </form>
    </div>

    <!-- 3. Si ya estaba activada -->
    <div id="vistaYaRegistrada" class="hidden">
      <h2 style="margin:0 0 6px; font-size:1.1rem;">¡Chapita activada!</h2>
      <p id="resumenPerrito">—</p>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfs9FUMFCMYGprhVSRj2vYx_kko0sbrHY",
      authDomain: "patitas-seguras-salta.firebaseapp.com",
      projectId: "patitas-seguras-salta",
      storageBucket: "patitas-seguras-salta.firebasestorage.app",
      messagingSenderId: "311814224464",
      appId: "1:311814224464:web:6cd643e607fbb90c3b6f55"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const params = new URLSearchParams(window.location.search);
    const chapitaId = (params.get("id") || params.get("c") || params.get("codigo") || "").trim();

    const txtCodigo = document.getElementById("txtCodigo");
    const vistaLogin = document.getElementById("vistaLogin");
    const vistaRegistro = document.getElementById("vistaRegistro");
    const vistaYaRegistrada = document.getElementById("vistaYaRegistrada");
    const txtUsuario = document.getElementById("txtUsuario");
    const msg = document.getElementById("msg");

    let usuarioActual = null;
    let chapitaListaParaActivar = false;

    function mostrarMsg(texto, tipo = "ok") {
      msg.textContent = texto;
      msg.className = `msg ${tipo}`;
    }

    function actualizarVistas() {
      vistaLogin.classList.add("hidden");
      vistaRegistro.classList.add("hidden");

      if (!chapitaListaParaActivar) return;

      if (usuarioActual) {
        vistaRegistro.classList.remove("hidden");
        txtUsuario.textContent = usuarioActual.email || usuarioActual.displayName;
      } else {
        vistaLogin.classList.remove("hidden");
      }
    }

    async function verificarChapita() {
      if (!chapitaId) {
        txtCodigo.textContent = "No se detectó ningún código en el QR.";
        return;
      }
      txtCodigo.textContent = `Chapita: ${chapitaId}`;

      try {
        const invRef = doc(db, "chapitasInventario", chapitaId);
        const invSnap = await getDoc(invRef);

        if (!invSnap.exists()) {
          mostrarMsg(`El código "${chapitaId}" no existe en chapitasInventario.`, "err");
          return;
        }

        const data = invSnap.data();
        if (data.status === "activada" || data.estado === "activada") {
          vistaYaRegistrada.classList.remove("hidden");
          document.getElementById("resumenPerrito").textContent =
            `Esta chapita ya está activada para ${data.nombreMascota || "una mascota"} (Contacto: ${data.telefono || "—"}).`;
          return;
        }

        chapitaListaParaActivar = true;
        actualizarVistas();
      } catch (e) {
        console.error(e);
        mostrarMsg("Error al consultar la chapita.", "err");
      }
    }

    document.getElementById("btnGoogle").addEventListener("click", async () => {
      msg.className = "msg";
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        console.error(e);
        mostrarMsg(`Error (${e.code || "sin código"}): ${e.message}`, "err");
      }
    });

    document.getElementById("btnSalir").addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, (user) => {
      usuarioActual = user;
      actualizarVistas();
    });

    document.getElementById("formPerrito").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!usuarioActual || !chapitaId) return;

      const btn = document.getElementById("btnGuardar");
      btn.disabled = true;
      btn.textContent = "Guardando...";

      const datosActivacion = {
        status: "activada",
        estado: "activada",
        nombreMascota: document.getElementById("nombreMascota").value.trim(),
        raza: document.getElementById("raza").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        nota: document.getElementById("nota").value.trim(),
        duenoUid: usuarioActual.uid,
        duenoEmail: usuarioActual.email || "",
        fechaActivacion: serverTimestamp()
      };

      try {
        await updateDoc(doc(db, "chapitasInventario", chapitaId), datosActivacion);

        chapitaListaParaActivar = false;
        vistaRegistro.classList.add("hidden");
        vistaYaRegistrada.classList.remove("hidden");
        document.getElementById("resumenPerrito").textContent =
          `¡Listo! Activaste la chapita ${chapitaId} para ${datosActivacion.nombreMascota} con tu cuenta (${usuarioActual.email}).`;
        mostrarMsg("Chapita guardada en chapitasInventario.", "ok");
      } catch (err) {
        console.error(err);
        mostrarMsg(`Error al guardar: ${err.code || err.message || "revisá permisos"}`, "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar y activar chapita";
      }
    });

    verificarChapita();
  </script>
</body>
</html>
